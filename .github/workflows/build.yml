# Builds the official Keila image with the Japanese translation added and
# publishes it as ghcr.io/v0idnil/keila:<version>-ja.
#
# - Daily: builds the newest upstream release if its -ja image doesn't exist yet.
# - On push to main (translation changed): rebuilds the newest release and
#   overwrites its -ja tag.
# - Manually: any version, optionally forced.
name: Build Keila with Japanese

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "priv/**"
      - "apply.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Keila version, e.g. 0.30.3 (empty = newest release)"
        required: false
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE: ghcr.io/v0idnil/keila
  UPSTREAM: https://github.com/pentacent/keila

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Scheduled workflows in public repos are disabled after 60 days without
      # repository activity. Re-enabling through the API on every run keeps
      # this one alive without dummy commits.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
          else
            version=$(git ls-remote --tags --refs "${UPSTREAM}" 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          echo "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: ${version}"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Keila ${version}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip if already built
        id: skip
        env:
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.v.outputs.version }}-ja
        run: |
          if [ "${EVENT}" != "push" ] && [ "${FORCE}" != "true" ] \
             && docker manifest inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "${IMAGE}:${TAG} exists, nothing to do"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          path: overlay
          persist-credentials: false

      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          repository: pentacent/keila
          ref: v${{ steps.v.outputs.version }}
          path: keila
          persist-credentials: false

      - name: Add Japanese
        if: steps.skip.outputs.skip != 'true'
        run: overlay/apply.sh keila

      - uses: docker/setup-buildx-action@v3
        if: steps.skip.outputs.skip != 'true'

      # Same build as upstream's release workflow (ops/Dockerfile, WITH_EXTRA=1).
      - uses: docker/build-push-action@v6
        if: steps.skip.outputs.skip != 'true'
        with:
          context: keila
          file: keila/ops/Dockerfile
          build-args: |
            WITH_EXTRA=1
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-ja
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Keila ${{ steps.v.outputs.version }} with Japanese public pages
            org.opencontainers.image.licenses=AGPL-3.0-only
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
